name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at 09:00 UTC (16:00 WIB)
    - cron: '0 9 */3 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Ping Supabase
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: node .github/scripts/ping-supabase.js
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Keep-alive ping failed! Check Supabase project status."
          echo "Project may be paused if not resumed within 7 days of last activity."
